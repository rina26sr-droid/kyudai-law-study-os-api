services:
  - type: web
    name: kyudai-law-study-os-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: WRITE_ENABLED
        value: "true"
      - key: LOG_ENABLED
        value: "true"
      - key: SPREADSHEET_ID
        sync: false
      - key: API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
